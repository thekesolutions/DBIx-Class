name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.10', '5.12', '5.14', '5.16', '5.18', '5.20', '5.22', '5.24', '5.26', '5.28', '5.30', '5.32', '5.34', '5.36', '5.38', '5.40']
        os: [ubuntu-latest]
        include:
          # Test on different OS with latest stable Perl
          - perl: '5.40'
            os: macos-latest
          - perl: '5.40'
            os: windows-latest

    runs-on: ${{ matrix.os }}
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: ${{ matrix.perl }}
        distribution: ${{ matrix.os == 'windows-latest' && 'strawberry' || 'default' }}

    - name: Show Perl version
      run: perl -v

    - name: Install Module::Install
      run: cpanm --notest Module::Install

    - name: Configure
      run: perl Makefile.PL

    - name: Install dependencies
      run: ${{ matrix.os == 'windows-latest' && 'dmake installdeps' || 'make installdeps' }}

    - name: Build
      run: ${{ matrix.os == 'windows-latest' && 'dmake' || 'make' }}

    - name: Test
      run: ${{ matrix.os == 'windows-latest' && 'dmake test' || 'make test' }}

    - name: Test our scalar reference fix
      run: perl -Ilib t/752sqlite_scalar_ref_warning.t
